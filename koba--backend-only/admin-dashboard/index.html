    <script>
      (function() {
        var cryptoLike = typeof globalThis !== 'undefined' ? globalThis.crypto : undefined;
        if (!cryptoLike || typeof cryptoLike.randomUUID === 'function') {
          return;
        }

        var fallback = function() {
          if (cryptoLike && typeof cryptoLike.getRandomValues === 'function') {
            return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function(char) {
              return (
                Number(char) ^
                ((cryptoLike.getRandomValues(new Uint8Array(1))[0] & 15) >> (Number(char) / 4))
              ).toString(16);
            });
          }

          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(char) {
            var value = Math.floor(Math.random() * 16);
            var resolved = char === 'x' ? value : (value & 0x3) | 0x8;
            return resolved.toString(16);
          });
        };

        try {
          Object.defineProperty(cryptoLike, 'randomUUID', {
            configurable: true,
            value: fallback
          });
        } catch (_) {
          globalThis.__queenkobaAdminRandomUUID = fallback;
        }
      })();
    </script>
