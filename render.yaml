# Render Infrastructure Blueprint Configuration
# Deploy Backend API Service on Render

services:
  - type: web
    name: queenkoba-backend
    runtime: python
    region: virginia
    plan: free
    rootDir: koba--backend-only/backend/queen-koba-backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT queenkoba_mongodb:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: postgresql://mqulima_db_8hkt_user:J1Xpox2VtlIiIMGZCic6x9FvPsqlviMc@dpg-dahetoafngtc7397clsg-a/mqulima_db_8hkt
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://www.queenkoba.com
      - key: ADMIN_URL
        value: https://queenkoba-admin-workspace.vercel.app
      - key: CORS_ORIGINS
        value: https://queenkoba.vercel.app,https://www.queenkoba.com,https://queenkoba.com,https://queenkoba-admin-workspace.vercel.app,https://queenkoba-admin.vercel.app
